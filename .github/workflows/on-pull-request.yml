name: on-pull-request
run-name: on pull request activity

on:
  # 使用 pull_request_target，使外部用户提交 PR 后无需维护者逐个批准即可生成预览。
  # 注意：build-preview 会 checkout 并执行 PR 分支中的代码，同时需要写入 gh-pages。
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: write
  pull-requests: write

jobs:
  update-citations:
    # 只在同仓库的 PR 中运行
    if: github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/update-citations.yaml
    with:
      write-back: true

  build-preview:
    # 所有 PR 都构建预览，不依赖 update-citations
    uses: ./.github/workflows/build-preview.yaml
